<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片描述录音</title>
    <style>
        :root {
            --bg-main: #f3faf6;
            --bg-alt: #edf5ff;
            --card: #ffffff;
            --text: #1f2a33;
            --muted: #59707d;
            --line: #d5e7df;
            --brand: #0f766e;
            --accent: #0369a1;
            --ok: #15803d;
            --warn: #b45309;
            --err: #b91c1c;
            --shadow: 0 18px 34px rgba(25, 40, 52, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "HarmonyOS Sans SC", "Source Han Sans CN", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 4%, rgba(255, 241, 184, 0.78) 0, transparent 34%),
                radial-gradient(circle at 94% 0%, rgba(202, 228, 246, 0.86) 0, transparent 34%),
                linear-gradient(152deg, var(--bg-main) 0%, var(--bg-alt) 100%);
            padding: 20px 14px;
        }

        .shell {
            max-width: 1120px;
            margin: 0 auto;
            animation: enter 0.5s ease;
        }

        .top {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dfeee7;
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 16px 18px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
        }

        .top p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .top h1 {
            margin: 6px 0 0;
            font-size: clamp(1.35rem, 2.1vw, 1.85rem);
            line-height: 1.25;
        }

        .progress-card {
            min-width: 250px;
            border: 1px solid #d2e6dd;
            background: #f9fffc;
            border-radius: 14px;
            padding: 11px 12px;
        }

        .progress-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 7px;
        }

        .progress-head strong {
            color: var(--text);
            font-size: 16px;
        }

        .progress-track {
            height: 10px;
            width: 100%;
            background: #e5efea;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #22c55e 0%, var(--brand) 100%);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 14px 28px rgba(25, 40, 52, 0.08);
        }

        .image-card {
            padding: 14px;
        }

        .image-wrap {
            border-radius: 14px;
            border: 1px solid #e0ece7;
            background: #f8fdfb;
            padding: 12px;
        }

        .image-wrap img {
            width: 100%;
            max-height: 580px;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            background: #edf5f1;
        }

        .image-note {
            margin: 10px 2px 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .action-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .action-card.is-recording {
            border-color: #f6a34f;
            box-shadow: 0 18px 34px rgba(180, 83, 9, 0.18);
        }

        .prompt-box {
            border: 1px solid #cfe6dd;
            border-radius: 14px;
            background: linear-gradient(140deg, #f4fbf7 0%, #eff8ff 100%);
            padding: 12px 13px;
        }

        .prompt-box .label {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--brand);
            background: #daf1eb;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .prompt-box p {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 700;
            min-height: 24px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #9aa8b0;
            box-shadow: 0 0 0 0 rgba(154, 168, 176, 0.5);
        }

        .status-dot.active {
            background: var(--err);
            animation: pulse 1.4s ease-in-out infinite;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        button {
            border: 0;
            border-radius: 11px;
            min-height: 46px;
            padding: 10px 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: saturate(1.03);
        }

        button:disabled {
            cursor: not-allowed;
            color: #e9eef1;
            background: #97a9b2;
            box-shadow: none;
        }

        #startRecording {
            background: linear-gradient(135deg, #22c55e 0%, var(--ok) 100%);
            box-shadow: 0 9px 15px rgba(21, 128, 61, 0.26);
        }

        #stopRecording {
            background: linear-gradient(135deg, #ef4444 0%, var(--err) 100%);
            box-shadow: 0 9px 15px rgba(185, 28, 28, 0.24);
        }

        #nextImageBtn {
            background: linear-gradient(135deg, #0ea5e9 0%, var(--accent) 100%);
            box-shadow: 0 9px 15px rgba(3, 105, 161, 0.24);
        }

        .msg {
            display: none;
            border-radius: 12px;
            border: 1px solid transparent;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.55;
        }

        .msg.ok {
            display: block;
            color: #166534;
            background: #dcfce7;
            border-color: #86efac;
        }

        .msg.warn {
            display: block;
            color: #92400e;
            background: #fef3c7;
            border-color: #fcd34d;
        }

        .msg.err {
            display: block;
            color: #991b1b;
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .done {
            display: none;
            border-radius: 12px;
            border: 1px solid #93c5fd;
            background: linear-gradient(140deg, #eff8ff 0%, #e2f0ff 100%);
            color: #0c4a6e;
            padding: 11px 12px;
            font-size: 14px;
            font-weight: 800;
        }

        .countdown {
            color: #1d4ed8;
            font-size: 20px;
            margin: 0 3px;
        }

        .helper {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        @media (max-width: 940px) {
            .top {
                grid-template-columns: 1fr;
            }

            .progress-card {
                min-width: 0;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.5);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(185, 28, 28, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(185, 28, 28, 0);
            }
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="top">
            <div>
                <p>Language Experiment Console</p>
                <h1>语音回答采集</h1>
            </div>

            <aside class="progress-card" aria-label="实验进度">
                <div class="progress-head">
                    <span>当前进度</span>
                    <strong>{{ image_index }} / {{ total_images }}</strong>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </aside>
        </header>

        <main class="layout">
            <section class="card image-card">
                <div class="image-wrap">
                    <img src="{{ image_url }}" alt="实验图片" onerror="this.src='https://via.placeholder.com/720x520?text=%E5%9B%BE%E7%89%87%E5%8A%A0%E8%BD%BD%E5%A4%B1%E8%B4%A5'">
                </div>
                <p class="image-note">请优先描述画面核心对象，内容尽量完整且自然。</p>
            </section>

            <section class="card action-card" id="actionPanel">
                <div class="prompt-box">
                    <span class="label">本题提示</span>
                    <p>{{ prompt }}</p>
                </div>

                <div class="status-row">
                    <span class="status-dot" id="recordingDot"></span>
                    <span id="recordingStatus">请点击“开始录音”</span>
                </div>

                <div class="controls">
                    <button id="startRecording">开始录音</button>
                    <button id="stopRecording" disabled>停止录音</button>
                    <button id="nextImageBtn" onclick="nextImage()" disabled>下一张</button>
                </div>

                <div class="msg" id="statusMessage" role="status" aria-live="polite"></div>

                <div class="done" id="completionMessage">
                    全部题目已完成，<span class="countdown" id="countdown">3</span> 秒后跳转...
                </div>

                <p class="helper">录音保存成功后，系统会自动解锁“下一张”。</p>
            </section>
        </main>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let questionStartTime = null;
        let currentQuestionDuration = 0;
        let countdownTimer = null;

        const startButton = document.getElementById("startRecording");
        const stopButton = document.getElementById("stopRecording");
        const nextImageBtn = document.getElementById("nextImageBtn");
        const recordingStatus = document.getElementById("recordingStatus");
        const statusMessage = document.getElementById("statusMessage");
        const completionMessage = document.getElementById("completionMessage");
        const countdownEl = document.getElementById("countdown");
        const actionPanel = document.getElementById("actionPanel");
        const recordingDot = document.getElementById("recordingDot");
        const progressFill = document.getElementById("progressFill");

        function showMessage(text, level) {
            statusMessage.textContent = text;
            statusMessage.className = "msg";
            if (level === "ok") statusMessage.classList.add("ok");
            if (level === "warn") statusMessage.classList.add("warn");
            if (level === "err") statusMessage.classList.add("err");
        }

        function setRecordingVisual(active) {
            actionPanel.classList.toggle("is-recording", active);
            recordingDot.classList.toggle("active", active);
        }

        function resetUI() {
            audioChunks = [];
            isRecording = false;
            questionStartTime = null;
            currentQuestionDuration = 0;
            startButton.disabled = false;
            stopButton.disabled = true;
            nextImageBtn.disabled = true;
            recordingStatus.textContent = "请点击“开始录音”";
            setRecordingVisual(false);
        }

        function updateProgressBar() {
            const index = parseInt("{{ image_index }}", 10);
            const total = parseInt("{{ total_images }}", 10);
            const safeTotal = Number.isFinite(total) && total > 0 ? total : 1;
            const safeIndex = Number.isFinite(index) && index > 0 ? index : 1;
            const ratio = Math.min(100, Math.max(0, (safeIndex / safeTotal) * 100));
            progressFill.style.width = ratio.toFixed(2) + "%";
        }

        function startCountdown(seconds, url) {
            let rest = seconds;
            completionMessage.style.display = "block";
            countdownEl.textContent = String(rest);

            countdownTimer = window.setInterval(() => {
                rest -= 1;
                countdownEl.textContent = String(rest);
                if (rest <= 0) {
                    window.clearInterval(countdownTimer);
                    window.location.href = url;
                }
            }, 1000);
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
            showMessage("当前浏览器不支持录音，请使用最新版 Chrome/Edge。", "err");
            startButton.disabled = true;
        }

        startButton.addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                let mimeType = "";
                const candidates = [
                    "audio/webm;codecs=opus",
                    "audio/webm",
                    "audio/mp4"
                ];
                for (const type of candidates) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        mimeType = type;
                        break;
                    }
                }

                mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach((track) => track.stop());
                    await saveRecording();
                };

                mediaRecorder.start(200);
                isRecording = true;
                questionStartTime = Date.now();
                currentQuestionDuration = 0;

                startButton.disabled = true;
                stopButton.disabled = false;
                recordingStatus.textContent = "录音中...";
                setRecordingVisual(true);
                showMessage("已开始录音，请说话后点击停止。", "warn");
            } catch (error) {
                console.error("start recording error:", error);
                setRecordingVisual(false);
                showMessage("无法开始录音。请检查麦克风权限，或确认你在安全环境访问页面。", "err");
            }
        });

        stopButton.addEventListener("click", () => {
            if (!mediaRecorder || !isRecording) return;

            currentQuestionDuration = questionStartTime
                ? Math.max(0, (Date.now() - questionStartTime) / 1000)
                : 0;

            questionStartTime = null;
            isRecording = false;
            mediaRecorder.stop();
            setRecordingVisual(false);

            startButton.disabled = true;
            stopButton.disabled = true;
            recordingStatus.textContent = "处理中...";
            showMessage("正在上传录音，请稍候...", "warn");
        });

        async function saveRecording() {
            if (!audioChunks.length) {
                showMessage("没有采集到音频数据，请重试。", "err");
                resetUI();
                return;
            }

            const blobType = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
            const audioBlob = new Blob(audioChunks, { type: blobType });
            const reader = new FileReader();

            reader.onload = async () => {
                try {
                    const audioData = reader.result;
                    const response = await fetch(window.location.href, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: "audio_data=" + encodeURIComponent(audioData) +
                            "&question_duration=" + encodeURIComponent(currentQuestionDuration.toFixed(3))
                    });

                    const data = await response.json();

                    if (data.status === "completed") {
                        recordingStatus.textContent = "已完成";
                        showMessage("录音已保存，实验完成。", "ok");
                        startCountdown(3, "/completion");
                        return;
                    }

                    if (data.status === "success") {
                        recordingStatus.textContent = "录音保存成功";
                        showMessage("录音保存成功，可以进入下一张。", "ok");
                        nextImageBtn.disabled = false;
                        startButton.disabled = false;
                        stopButton.disabled = true;
                        return;
                    }

                    if (data.status === "warning") {
                        recordingStatus.textContent = "请重试";
                        showMessage(data.message || "录音保存失败，请重试。", "warn");
                        resetUI();
                        return;
                    }

                    showMessage("保存失败: " + (data.message || "未知错误"), "err");
                    resetUI();
                } catch (error) {
                    console.error("save recording error:", error);
                    showMessage("录音上传失败，请检查网络或后端日志。", "err");
                    resetUI();
                }
            };

            reader.readAsDataURL(audioBlob);
        }

        function nextImage() {
            if (nextImageBtn.disabled) {
                showMessage("请先完成本题录音并保存。", "err");
                return;
            }
            const currentIndex = parseInt("{{ image_index }}", 10);
            const nextIndex = currentIndex + 1;
            window.location.href = "/answer/{{ group }}/" + nextIndex;
        }

        window.addEventListener("beforeunload", (event) => {
            if (isRecording) {
                event.preventDefault();
                event.returnValue = "正在录音，离开页面会丢失本次录音。";
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            resetUI();
            updateProgressBar();
        });
    </script>
</body>
</html>
