<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择实验组</title>
    <style>
        :root {
            --bg-main: #f4faf7;
            --bg-alt: #eef4ff;
            --card: #ffffff;
            --text: #1f2a33;
            --muted: #5a6c79;
            --line: #d5e7df;
            --brand: #0f766e;
            --accent: #0369a1;
            --shadow: 0 18px 36px rgba(27, 44, 56, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "HarmonyOS Sans SC", "Source Han Sans CN", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 7% 6%, rgba(255, 241, 184, 0.8) 0, transparent 35%),
                radial-gradient(circle at 94% 0%, rgba(205, 228, 248, 0.85) 0, transparent 33%),
                linear-gradient(155deg, var(--bg-main) 0%, var(--bg-alt) 100%);
            padding: 24px 14px;
        }

        .shell {
            max-width: 980px;
            margin: 0 auto;
            animation: enter 0.5s ease;
        }

        .top {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e3f0ea;
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .title-wrap p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .title-wrap h1 {
            margin: 6px 0 0;
            font-size: clamp(1.45rem, 2.4vw, 2rem);
        }

        .student-chip {
            background: linear-gradient(135deg, #14b8a6 0%, var(--brand) 100%);
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 9px 16px rgba(15, 118, 110, 0.3);
        }

        .panel {
            margin-top: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 14px 28px rgba(27, 44, 56, 0.08);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .panel-head h2 {
            margin: 0;
            font-size: 1.18rem;
        }

        .panel-head span {
            color: var(--muted);
            font-size: 13px;
        }

        .group-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .group-list li {
            margin: 0;
        }

        .group-link {
            text-decoration: none;
            border: 1px solid #cfe6dd;
            background: linear-gradient(160deg, #f7fffc 0%, #eef7f3 100%);
            border-radius: 14px;
            padding: 14px;
            color: var(--text);
            display: block;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .group-link:hover {
            transform: translateY(-2px);
            border-color: #9fd4c5;
            box-shadow: 0 12px 20px rgba(15, 118, 110, 0.16);
        }

        .group-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .num {
            font-size: 13px;
            font-weight: 700;
            color: #0d9488;
            background: #d4f6ef;
            border: 1px solid #b6e9dd;
            border-radius: 999px;
            padding: 4px 10px;
        }

        .tag {
            color: var(--muted);
            font-size: 12px;
        }

        .group-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .group-desc {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: flex-start;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 11px;
            padding: 8px 14px;
            text-decoration: none;
            border: 1px solid #c9dfd6;
            color: var(--brand);
            background: #effaf7;
            font-weight: 700;
            font-size: 14px;
        }

        .back-link:hover {
            border-color: #a7d7c8;
        }

        @media (max-width: 820px) {
            .group-list {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="top">
            <div class="title-wrap">
                <p>Language Experiment Console</p>
                <h1>选择实验组</h1>
            </div>
            <div class="student-chip">学号 {{ student_id }}</div>
        </header>

        <section class="panel">
            <div class="panel-head">
                <h2>可用实验组</h2>
                <span>流程 2 / 3</span>
            </div>

            <ul class="group-list">
                {% for group in groups %}
                <li>
                    <a class="group-link" href="{{ url_for('start_group', group=group) }}">
                        <div class="group-meta">
                            <span class="num">实验组 {{ loop.index }}</span>
                            <span class="tag">点击进入</span>
                        </div>
                        <div class="group-name">{{ group }}</div>
                        <p class="group-desc">进入后将从第 1 题开始录音采集。</p>
                    </a>
                </li>
                {% endfor %}
            </ul>

            <div class="footer">
                <a class="back-link" href="{{ url_for('rules') }}">返回规则页</a>
            </div>
        </section>
    </div>
</body>
</html>
