
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验图片 - {{ group }} - 第{{ image_index }}张</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { background: white; border-radius: 10px; padding: 30px; max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #eee; }
        .header h1 { color: #333; margin-bottom: 10px; }
        .progress { color: #666; font-size: 16px; }

        .image-container { text-align: center; margin: 30px 0; min-height: 400px; position: relative; }
        #experiment-image { max-width: 100%; max-height: 500px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #666; }

        .prompt-section { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 25px 0; border-left: 4px solid #007bff; }
        .prompt-section h3 { color: #007bff; margin-bottom: 10px; }
        #prompt-text { font-size: 18px; line-height: 1.6; }

        .recording-section { margin: 30px 0; padding: 25px; background: #fff8e1; border-radius: 8px; border: 2px dashed #ffc107; }
        .controls { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .control-btn { padding: 12px 30px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
        #record-btn { background: #dc3545; color: white; }
        #record-btn:hover { background: #c82333; }
        #record-btn.recording { background: #28a745; animation: pulse 1.5s infinite; }
        #stop-btn { background: #6c757d; color: white; }
        #stop-btn:hover { background: #5a6268; }
        #submit-btn { background: #007bff; color: white; }
        #submit-btn:hover { background: #0056b3; }

        .navigation { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        .nav-btn { padding: 10px 25px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .nav-btn:hover { background: #5a6268; }
        #next-btn { background: #28a745; }
        #next-btn:hover { background: #218838; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .status-message { padding: 10px; border-radius: 5px; margin: 10px 0; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>实验任务 - {{ group }}</h1>
            <div class="progress">进度: 第 <span id="current-index">{{ image_index }}</span> / {{ total_images }} 张图片</div>
        </div>

        <div class="image-container">
            <div class="loading" id="loading-text">加载图片中...</div>
            <img id="experiment-image" 
                 src="{{ image_url }}" 
                 alt="实验图片"
                 onload="imageLoaded()"
                 onerror="imageError()"
                 style="display: none;">
        </div>

        <div class="prompt-section">
            <h3>提示词：</h3>
            <p id="prompt-text">{{ prompt }}</p>
        </div>

        <div class="recording-section">
            <h3>录音回答：</h3>
            <div class="controls">
                <button id="record-btn" class="control-btn" onclick="startRecording()">🎤 开始录音</button>
                <button id="stop-btn" class="control-btn" onclick="stopRecording()" disabled>⏹️ 停止录音</button>
                <button id="submit-btn" class="control-btn" onclick="submitAnswer()" disabled>📤 提交答案</button>
            </div>
            <div id="status-message" class="status-message"></div>
            <audio id="audio-playback" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
        </div>

        <div class="navigation">
            <a href="{{ url_for('index') }}" class="nav-btn">🏠 返回组选择</a>
            <button id="next-btn" class="nav-btn" onclick="goToNextImage()" disabled>⏭️ 下一张图片 ({{ next_index }})</button>
        </div>
    </div>

    <script>
        let currentGroup = "{{ group }}";
        let currentIndex = parseInt("{{ image_index }}");
        let nextIndex = parseInt("{{ next_index }}");

        function imageLoaded() {
            document.getElementById('experiment-image').style.display = 'block';
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('next-btn').disabled = false;

            // 预加载下一张图片
            preloadNextImage();
        }

        function imageError() {
            document.getElementById('loading-text').textContent = '图片加载失败';
        }

        function preloadNextImage() {
            const img = new Image();
            img.src = `/get_image_data/${currentGroup}/${nextIndex}`;
        }

        function goToNextImage() {
            window.location.href = `/answer/${currentGroup}/${nextIndex}`;
        }

        // 简单的录音功能（测试用）
        async function startRecording() {
            showStatus('正在录音...', 'info');
            document.getElementById('record-btn').classList.add('recording');
            document.getElementById('record-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
        }

        function stopRecording() {
            showStatus('录音完成，请提交答案', 'success');
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('record-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('submit-btn').disabled = false;
        }

        function submitAnswer() {
            showStatus('答案已保存！正在跳转到下一张...', 'success');
            setTimeout(() => goToNextImage(), 1500);
        }

        function showStatus(message, type) {
            const element = document.getElementById('status-message');
            element.textContent = message;
            element.className = 'status-message ' + type;
            element.style.display = 'block';
        }

        // 页面加载完成后检查图片状态
        document.addEventListener('DOMContentLoaded', function() {
            const img = document.getElementById('experiment-image');
            if (img.complete) {
                imageLoaded();
            }
        });
    </script>
</body>
</html>
