<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片描述实验 - 录音版 | [Tech Interface]</title>
    <style>
        /* 统一的现代风格变量 */
        :root {
            --primary-color: #4c51bf; /* 主色：柔和的靛蓝色 */
            --primary-light: #667eea;
            --bg-page: #f4f6f9; /* 页面背景：浅灰蓝 */
            --bg-card: #ffffff; /* 卡片背景：白色 */
            --text-dark: #333333;
            --text-medium: #666666;
            --border-color: #e2e8f0;
            --success-color: #059669;
            --processing-color: #f59e0b;
            --error-color: #ef4444;
            --font-clean: 'Segoe UI', system-ui, sans-serif, 'Microsoft YaHei';
        }

        body {
            font-family: var(--font-clean);
            max-width: 900px;
            margin: 0 auto;
            padding: 25px;
            text-align: center;
            background-color: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* 标题 */
        h1 {
            color: var(--primary-color);
            letter-spacing: 1px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* 进度条/信息面板 */
        .progress {
            margin: 15px 0;
            color: var(--text-medium);
            font-size: 16px;
            background-color: #edf2f7; /* 略浅的背景 */
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* 图片容器 */
        .image-container {
            margin: 25px 0;
            background-color: #edf2f7;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .image-container img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* 提示文字 */
        .prompt {
            font-size: 20px;
            font-weight: 600;
            margin: 30px 0;
            color: var(--text-dark);
            background-color: var(--primary-light);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(76, 81, 191, 0.3);
        }

        /* 录音控制区 */
        .recording-controls {
            margin: 35px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* 按钮基础样式 */
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 150px;
            letter-spacing: 0.5px;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* 开始录音 */
        #startRecording {
            background-color: var(--success-color);
        }
        #startRecording:hover:not(:disabled) {
            background-color: #047857;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(5, 150, 105, 0.4);
        }

        /* 停止录音 */
        #stopRecording {
            background-color: var(--error-color);
        }
        #stopRecording:hover:not(:disabled) {
            background-color: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(239, 68, 68, 0.4);
        }

        /* 按钮禁用状态 */
        button:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 1;
            box-shadow: none;
            transform: none;
        }

        /* 录音状态显示 */
        .recording-status {
            margin: 20px 0;
            font-weight: 600;
            min-height: 24px;
            font-size: 16px;
            color: var(--primary-color);
        }

        /* 录音指示灯 */
        .recording-indicator {
            display: none;
            color: var(--error-color);
            font-weight: bold;
            animation: pulse 1.5s infinite;
            margin-right: 10px;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 导航按钮（下一张） */
        .navigation {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        #nextImageBtn {
            background-color: var(--primary-color);
        }
        #nextImageBtn:hover:not(:disabled) {
            background-color: #3f47ac;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(76, 81, 191, 0.4);
        }

        /* 状态消息区域 */
        .status-message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-weight: 600;
            font-size: 15px;
            border-left: 5px solid;
        }

        .status-success {
            color: var(--success-color);
            border-color: var(--success-color);
            background-color: #d1fae5;
        }

        .status-error {
            color: var(--error-color);
            border-color: var(--error-color);
            background-color: #fee2e2;
        }

        .status-processing {
            color: var(--processing-color);
            border-color: var(--processing-color);
            background-color: #fffbeb;
        }

        /* 完成消息 */
        .completion-message {
            margin: 25px 0;
            padding: 20px;
            background-color: #e0f2fe;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 18px;
        }

        .countdown {
            font-size: 20px;
            color: var(--error-color);
            font-weight: 700;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>[系统] 图片描述实验 - 语音输入</h1>

        <div class="progress">
            图片批次: {{ image_index }} / {{ total_images }}
        </div>

        <div class="image-container">
            <img src="{{ image_url }}" alt="实验图片" onerror="this.src='https://via.placeholder.com/400x300?text=数据源加载失败'">
        </div>

        <div class="prompt">
            {{ prompt }}
        </div>


        <div class="recording-controls">
            <button id="startRecording">开始录音</button>
            <button id="stopRecording" disabled>终止录音</button>
        </div>

        <div class="recording-status">
            <span id="recordingIndicator" class="recording-indicator">● LIVE_INPUT</span>
            <span id="recordingStatus">实验准备就绪</span>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div id="completionMessage" class="completion-message">
            [PROCESS_COMPLETE] 所有数据任务已完成！系统将在<span class="countdown" id="countdown">3</span>秒后自动跳转至报告界面...
        </div>

        <div class="navigation">
            <button id="nextImageBtn" onclick="nextImage()" disabled>加载下一张图片 >></button>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let countdownInterval;

        // 获取DOM元素
        const startButton = document.getElementById('startRecording');
        const stopButton = document.getElementById('stopRecording');
        const nextImageBtn = document.getElementById('nextImageBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recordingStatus = document.getElementById('recordingStatus');
        const statusMessage = document.getElementById('statusMessage');
        const completionMessage = document.getElementById('completionMessage');
        const countdownElement = document.getElementById('countdown');

        // 显示状态消息
        function showStatusMessage(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            statusMessage.style.display = 'block';

            if (type === 'success') {
                statusMessage.classList.add('status-success');
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
            } else if (type === 'processing') {
                statusMessage.classList.add('status-processing');
            }
        }

        // 开始倒计时并自动跳转
        function startCountdown(seconds, redirectUrl) {
            let count = seconds;
            completionMessage.style.display = 'block';

            countdownInterval = setInterval(() => {
                countdownElement.textContent = count;
                count--;

                if (count < 0) {
                    clearInterval(countdownInterval);
                    window.location.href = redirectUrl;
                }
            }, 1000);
        }

        // 检查浏览器是否支持录音
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showStatusMessage('系统警告: 浏览器不支持录音模块，请切换至兼容的现代浏览器。', 'error');
        }

        // 开始录音
        startButton.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });

                // 尝试使用MP3编码，如果支持的话
                const options = { mimeType: 'audio/webm;codecs=opus' };

                // 检查是否支持MP3
                if (MediaRecorder.isTypeSupported('audio/mp3')) {
                    options.mimeType = 'audio/mp3';
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    options.mimeType = 'audio/webm';
                }

                mediaRecorder = new MediaRecorder(stream, options);

                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    // 录音停止后自动保存
                    await saveRecording();

                    // 停止所有音轨
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                // 更新UI状态
                startButton.disabled = true;
                stopButton.disabled = false;
                recordingIndicator.style.display = 'inline';
                recordingStatus.textContent = '录音获取中... [RECORDING]';
                showStatusMessage('录音已启动，请开始描述图片...', 'processing');

            } catch (error) {
                console.error('录音启动失败:', error);
                showStatusMessage('系统错误: 无法访问麦克风，请检查权限。', 'error');
            }
        });

        // 停止录音
        stopButton.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // 更新UI状态
                startButton.disabled = false;
                stopButton.disabled = true;
                recordingIndicator.style.display = 'none';
                recordingStatus.textContent = '录音处理中... [PROCESSING]';
                showStatusMessage('正在对录音数据上传', 'processing');
            }
        });

        // 保存录音并自动提交
        async function saveRecording() {
            if (audioChunks.length === 0) {
                showStatusMessage('录音为空，请重新捕获', 'error');
                resetRecordingState();
                return;
            }

            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();

            reader.onload = async function() {
                const audioData = reader.result;

                try {
                    // 显示处理中状态
                    showStatusMessage('正在上传并校验录音...', 'processing');

                    // 发送到服务器
                    const response = await fetch(window.location.href, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `audio_data=${encodeURIComponent(audioData)}`
                    });

                    const data = await response.json();

                    if (data.status === 'completed') {
                        // 所有题目完成
                        showStatusMessage('所有图片已完成！', 'success');
                        recordingStatus.textContent = '任务完成';

                        // 显示完成消息并开始倒计时
                        startCountdown(3, '/completion');

                    } else if (data.status === 'success') {
                        // 单个题目成功保存
                        showStatusMessage('✓ 录音上传成功！ [SAVE_OK]', 'success');
                        recordingStatus.textContent = '录音已保存 [SAVED]';

                        // 启用下一张按钮
                        nextImageBtn.disabled = false;

                    } else {
                        // 保存失败
                        showStatusMessage('数据保存失败: ' + data.message + ' [ERROR]', 'error');
                        recordingStatus.textContent = '保存失败 [ERROR]';
                        resetRecordingState();
                    }

                } catch (error) {
                    console.error('保存错误:', error);
                    showStatusMessage('数据传输失败，请检查网络连接', 'error');
                    recordingStatus.textContent = '传输失败';
                    resetRecordingState();
                }
            };

            reader.readAsDataURL(audioBlob);
        }

        // 重置录音状态
        function resetRecordingState() {
            audioChunks = [];
            startButton.disabled = false;
            stopButton.disabled = true;
            nextImageBtn.disabled = true; // 确保重置时下一张按钮禁用
        }

        // 下一张图片（功能代码保持不变）
        function nextImage() {
            if (nextImageBtn.disabled) {
                showStatusMessage('请先完成当前图片的录音', 'error');
                return;
            }

            const currentIndex = parseInt('{{ image_index }}');
            const nextIndex = currentIndex + 1;
            const totalImages = parseInt('{{ total_images }}');

            if (nextIndex <= totalImages) {
                window.location.href = `/answer/{{ group }}/${nextIndex}`;
            } else {
                showStatusMessage('已到达最后一个图片', 'info');
            }
        }

        // 页面卸载前提示（功能代码保持不变）
        window.addEventListener('beforeunload', (event) => {
            if (isRecording) {
                event.preventDefault();
                return '录音正在进行中，确定要中断进程吗？';
            }
        });

        // 页面加载时初始化（功能代码保持不变）
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化状态
            resetRecordingState();
        });
    </script>
</body>
</html>
